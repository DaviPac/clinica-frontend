<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Instituto CIN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <!--
    Aplica o tema antes do primeiro pixel: se isto rodasse só no Angular,
    a página piscaria no tema errado enquanto o bundle carrega.
    A mesma regra vive em core/services/tema/tema.service.ts.
  -->
  <script>
    (function () {
      var escolha;
      try { escolha = localStorage.getItem('tema'); } catch (e) { /* sem storage */ }
      var tema = escolha === 'claro' || escolha === 'escuro'
        ? escolha
        : (window.matchMedia &&
           window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');
      document.documentElement.dataset.theme = tema;
      document.documentElement.style.backgroundColor = tema === 'escuro' ? '#0a0e16' : '#fafaf9';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
