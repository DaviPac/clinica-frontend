<div class="linha__quando">
  @if (hoje()) {
    <span class="linha__hoje">Hoje</span>
  } @else {
    <span class="linha__dia-semana">{{ diaSemana() }}</span>
    <span class="linha__dia">{{ dia() }}</span>
  }
  <span class="linha__hora">{{ hora() }}</span>
</div>

<div class="linha__filete"></div>

<div class="linha__quem">
  <p class="linha__paciente">{{ paciente() }}</p>
  <p class="linha__secundario">{{ profissional() }}</p>
  <p class="linha__secundario">{{ servico() }}</p>
</div>

<div class="linha__estado">
  <app-status-badge [status]="status()" />
  <button type="button" class="linha__editar" title="Alterar status" (click)="alterarStatus.emit()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M9 1.5l2.5 2.5L4 11.5H1.5V9L9 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
