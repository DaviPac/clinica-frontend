<div class="login">
  <div class="login__cartao">

    <!-- Cabeçalho -->
    <div class="login__cabecalho">
      <div class="login__marca">
        <img class="login__logo" src="logo.png" alt="Logo Instituto CIN" />
        <span class="login__nome">Instituto CIN</span>
      </div>
      <p class="login__chamada">Entre com suas credenciais para continuar.</p>
    </div>

    <!-- Formulário -->
    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">

      <div>
        <label appRotulo for="login-email">E-mail</label>
        <input
          appCampo
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="voce@clinica.com"
        />
      </div>

      <div>
        <label appRotulo for="login-senha">Senha</label>
        <input
          appCampo
          id="login-senha"
          type="password"
          formControlName="senha"
          placeholder="••••••••"
        />
      </div>

      @if (erro()) {
        <app-alert>{{ erro() }}</app-alert>
      }

      <button
        appBotao
        tamanho="grande"
        [larguraTotal]="true"
        class="login__entrar"
        type="submit"
        [disabled]="form.invalid || loading()"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>
  </div>
</div>
