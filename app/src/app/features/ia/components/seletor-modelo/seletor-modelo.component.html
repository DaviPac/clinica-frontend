<div class="seletor">
  <button type="button" class="seletor__gatilho" (click)="aberto.set(!aberto())">
    <span class="seletor__modelo">{{ rotuloModelo() }}</span>
    @if (raciocinioAtivo()) {
      <span class="seletor__nivel">· {{ rotuloNivelCurto() }}</span>
    }
    <svg class="seletor__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9l6 6 6-6" />
    </svg>
  </button>

  @if (aberto()) {
    <div class="seletor__fora" (click)="aberto.set(false)"></div>

    <div class="seletor__painel">
      <p class="seletor__secao">Modelo</p>

      @for (m of modelos.modelos(); track m.id) {
        <button type="button" class="seletor__opcao" (click)="escolherModelo(m.id)">
          <span
            class="seletor__marca seletor__marca--alto"
            [class.seletor__marca--ativa]="m.id === modeloId()"></span>
          <span class="seletor__texto">
            <span class="seletor__rotulo">{{ m.rotulo }}</span>
            <span class="seletor__descricao">{{ m.descricao }}</span>
          </span>
        </button>
      }

      @if (suportaRaciocinio()) {
        <div class="seletor__raciocinio">
          <p class="seletor__secao">Raciocínio</p>
          @for (n of niveis; track n) {
            <button type="button" class="seletor__opcao seletor__opcao--nivel" (click)="escolherNivel(n)">
              <span class="seletor__marca" [class.seletor__marca--ativa]="n === nivel()"></span>
              <span class="seletor__nome-nivel">{{ rotulos[n] }}</span>
            </button>
          }
          <p class="seletor__nota">
            Mais raciocínio melhora tarefas com várias etapas, mas consome mais tokens.
          </p>
        </div>
      }
    </div>
  }
</div>
