@let m = mensagem();

@if (m.papel === 'usuario') {
  <div class="mensagem__fila">
    <div class="mensagem__balao">{{ m.texto }}</div>
  </div>
} @else {
  <div class="mensagem__resposta">
    <div class="mensagem__avatar">
      <svg class="mensagem__avatar-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 4.8L18.7 9.7l-4.8 1.9L12 16.4l-1.9-4.8L5.3 9.7l4.8-1.9L12 3z" />
      </svg>
    </div>

    <div class="mensagem__corpo">
      @if (m.raciocinio) {
        <details class="mensagem__raciocinio">
          <summary class="mensagem__raciocinio-titulo">
            <svg class="mensagem__raciocinio-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z" />
            </svg>
            Raciocínio
          </summary>
          <div class="mensagem__raciocinio-texto">{{ m.raciocinio }}</div>
        </details>
      }

      @if (m.texto) {
        <app-markdown [texto]="m.texto" />

        <button type="button" class="mensagem__copiar" (click)="copiar(m.texto)">
          <svg class="mensagem__copiar-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
          {{ copiado() ? 'Copiado' : 'Copiar' }}
        </button>
      }
    </div>
  </div>
}
