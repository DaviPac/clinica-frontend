@if (acao(); as a) {
  <div class="acao">
    @if (a.tipo === 'navegar') {
      <a class="acao__link" [routerLink]="a.comandos">
        <svg class="acao__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
        {{ a.rotulo }}
      </a>
    } @else {
      <button
        appBotao
        variante="contorno"
        class="acao__botao"
        type="button"
        [disabled]="baixando()"
        (click)="baixar(a)">
        <svg class="acao__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" />
        </svg>
        {{ baixando() ? 'Gerando PDF…' : a.rotulo }}
      </button>
    }

    @if (erro(); as e) {
      <p class="acao__erro">{{ e }}</p>
    }
  </div>
}
