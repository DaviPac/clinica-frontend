<div class="composer">
  <div class="composer__coluna">
    <div class="composer__caixa">
      <textarea
        #entrada
        class="composer__entrada"
        rows="1"
        [value]="texto()"
        [disabled]="bloqueado()"
        [placeholder]="placeholder()"
        (input)="aoDigitar($event)"
        (keydown)="aoTeclar($event)"></textarea>

      @if (ocupado()) {
        <button
          type="button"
          class="composer__botao composer__botao--parar"
          aria-label="Parar geração"
          (click)="parar.emit()">
          <span class="composer__quadrado"></span>
        </button>
      } @else {
        <button
          type="button"
          class="composer__botao composer__botao--enviar"
          aria-label="Enviar mensagem"
          [disabled]="!texto().trim() || bloqueado()"
          (click)="enviarTexto()">
          <svg class="composer__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
        </button>
      }
    </div>

    <p class="composer__nota">
      @if (aguardandoConfirmacao()) {
        Há uma ação aguardando sua confirmação acima.
      } @else {
        O assistente pede sua confirmação antes de qualquer alteração.
      }
    </p>
  </div>
</div>
