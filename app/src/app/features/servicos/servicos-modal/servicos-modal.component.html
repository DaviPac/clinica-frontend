<app-modal [titulo]="titulo" tamanho="pequeno" (fechar)="fechar.emit()">

  @if (erro()) {
    <app-alert class="servico-modal__erro">{{ erro() }}</app-alert>
  }

  <form class="servico-modal__form" [formGroup]="form" (ngSubmit)="submit()">

    @if (isAdmin() && !modoEdicao) {
      <app-filtro-profissional
        [profissionalId]="filtroProfissionalId()"
        (changed)="onFiltroChange($event)"
        [defaultText]="'--'"/>
    }

    <app-campo-form rotulo="Nome do serviço" para="servico-nome" [obrigatorio]="true">
      <input
        appCampo
        id="servico-nome"
        type="text"
        formControlName="nome"
        placeholder="Ex: Sessão de Psicologia"
      />
    </app-campo-form>

    <app-campo-form rotulo="Valor (R$)" para="servico-valor" [obrigatorio]="true">
      <input
        appCampo
        [mono]="true"
        id="servico-valor"
        type="number"
        formControlName="valor_atual"
        min="0.01"
        step="0.01"
        placeholder="0,00"
      />
    </app-campo-form>

    <div class="servico-modal__opcao">
      <app-toggle
        [checked]="!!form.controls.pacote.value"
        (changed)="form.controls.pacote.setValue($event)" />
      <div>
        <p class="servico-modal__opcao-titulo">Pacote de sessões</p>
        <p class="servico-modal__opcao-texto">Agrupa múltiplas sessões em um único serviço</p>
      </div>
    </div>

    <!-- Estado do serviço — só aparece no modo edição -->
    @if (modoEdicao) {
      <div class="servico-modal__opcao">
        <app-toggle
          [checked]="!!form.controls['ativo'].value"
          (changed)="form.controls['ativo'].setValue($event)" />
        <div>
          <p class="servico-modal__opcao-titulo">
            {{ form.controls['ativo'].value ? 'Serviço ativo' : 'Serviço inativo' }}
          </p>
          <p class="servico-modal__opcao-texto">Aparece na criação de agendamentos</p>
        </div>
      </div>
    }

    <div class="servico-modal__acoes">
      <button appBotao variante="contorno" type="button" (click)="fechar.emit()">
        Cancelar
      </button>
      <button appBotao type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Salvando...' : labelBotao }}
      </button>
    </div>

  </form>
</app-modal>
