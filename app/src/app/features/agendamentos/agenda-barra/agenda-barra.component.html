<div class="barra__grupo barra__modos">
  <button
    class="barra__botao barra__botao--modo"
    [class.barra__botao--ativo]="modo() === 'mensal'"
    (click)="modoChange.emit('mensal')"
  >Mês</button>
  <button
    class="barra__botao barra__botao--modo"
    [class.barra__botao--ativo]="modo() === 'semanal'"
    (click)="modoChange.emit('semanal')"
  >Semana</button>
</div>

<div class="barra__grupo barra__navegacao">
  <button class="barra__botao" aria-label="Período anterior" (click)="navegar.emit(-1)">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="barra__botao-texto">Anterior</span>
  </button>
  <button class="barra__botao" (click)="hoje.emit()">Hoje</button>
  <button class="barra__botao" aria-label="Próximo período" (click)="navegar.emit(1)">
    <span class="barra__botao-texto">Próximo</span>
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<button
  class="barra__filtros"
  [class.barra__filtros--ativo]="filtrosAbertos()"
  [attr.aria-expanded]="filtrosAbertos()"
  aria-label="Filtros"
  (click)="alternarFiltros.emit()">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path d="M2 4h12M4 8h8M6.5 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</button>
