<div>
  <p class="estado__rotulo">Andamento</p>
  <app-status-badge [status]="status()" />
</div>

<div>
  <p class="estado__rotulo">Pagamento</p>
  @if (pago()) {
    <span class="estado__pagamento estado__pagamento--pago">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Pago
    </span>
  } @else {
    <span class="estado__pagamento estado__pagamento--pendente">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 2v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Pendente
    </span>
  }
</div>
