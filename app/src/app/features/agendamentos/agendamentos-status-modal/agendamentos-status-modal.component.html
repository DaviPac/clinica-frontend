<app-modal titulo="Alterar status" tamanho="pequeno" (fechar)="fechar.emit()">

  <div class="status__atual">
    <span class="status__rotulo">Status atual:</span>
    <app-status-badge [status]="agendamento().status" />
  </div>

  @if (erro()) {
    <app-alert class="status__alerta">{{ erro() }}</app-alert>
  }

  @if (opcoes.length === 0) {
    <p class="status__sem-opcoes">
      Não há transições disponíveis para este status.
    </p>
  }

  <div class="status__opcoes">
    @for (op of opcoes; track op) {
      <button
        type="button"
        class="status__opcao {{ btnClass[op] }}"
        [disabled]="!!loading()"
        (click)="selecionar(op)">
        {{ loading() === op ? 'Salvando...' : labels[op] }}
      </button>
    }
  </div>

</app-modal>
