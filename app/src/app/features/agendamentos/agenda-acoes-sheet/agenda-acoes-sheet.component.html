<app-modal titulo="Ações da sessão" tamanho="pequeno" (fechar)="fechar.emit()">

  <div class="sheet">

    <div class="sheet__resumo">
      <div class="sheet__cabecalho">
        <span class="sheet__hora">{{ formatarHora(agendamento().dataHoraInicio) }}</span>
        <app-status-badge [status]="agendamento().status" />
      </div>
      <p class="sheet__paciente">{{ pacienteNome() }}</p>
      @if (profissionalNome()) {
        <p class="sheet__profissional">{{ profissionalNome() }}</p>
      }
      <p class="sheet__servico">{{ servicoNome() }}</p>
    </div>

    <div class="sheet__acoes">

      <a class="sheet__botao" [routerLink]="['/agendamentos', agendamento().id]">Ver detalhes</a>

      @if (podeAlterarStatus()) {
        <button type="button" class="sheet__botao" (click)="status.emit()">
          Alterar status
        </button>
      }

      <button
        type="button"
        class="sheet__botao"
        [class.sheet__botao--pago]="agendamento().pagoPeloPaciente"
        [disabled]="pagamentoBloqueado()"
        (click)="pagamento.emit()">
        {{ agendamento().pagoPeloPaciente ? 'Desmarcar pagamento' : 'Marcar como pago' }}
      </button>

      <!-- Destrutivo: fica em contorno, não em bloco sólido, para não
           virar o alvo mais fácil de tocar por acidente no rodapé. -->
      @if (podeCancelarSerie()) {
        <button type="button" class="sheet__botao sheet__botao--perigo" (click)="cancelarSerie.emit()">
          Cancelar série
        </button>
      }

    </div>
  </div>

</app-modal>
