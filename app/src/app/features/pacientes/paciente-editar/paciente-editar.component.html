<div appPagina class="editar">

  <app-link-voltar
    [rota]="paciente() ? '/pacientes/' + paciente()!.id : '/pacientes'"
    texto="Voltar" />

  @if (carregando()) {
    <app-carregando texto="Carregando..." espaco="nenhum" />
  }

  @if (erro()) {
    <app-alert class="editar__alerta">{{ erro() }}</app-alert>
  }

  @if (paciente(); as p) {
    <app-cartao>

      <div class="editar__cabecalho">
        <h1 class="editar__titulo">Editar paciente</h1>
        <p class="editar__subtitulo">Atualize os dados de {{ p.nome }}</p>
      </div>

      @if (erroSalvar()) {
        <app-alert class="editar__alerta editar__alerta--espacado">{{ erroSalvar() }}</app-alert>
      }

      <form class="editar__form" [formGroup]="form" (ngSubmit)="salvar()">

        <app-campo-form
          rotulo="Nome completo"
          [obrigatorio]="true"
          [erro]="campoInvalido('nome') ? 'Informe o nome completo (mínimo 3 caracteres).' : null">
          <input
            appCampo
            type="text"
            formControlName="nome"
            placeholder="Maria Oliveira"
            [estado]="campoInvalido('nome') ? 'invalido' : 'normal'"
          />
        </app-campo-form>

        <app-campo-form rotulo="CPF">
          <input appCampo [mono]="true" type="text" formControlName="cpf" placeholder="123.456.789-00" />
        </app-campo-form>

        <div class="editar__dupla">
          <app-campo-form
            rotulo="Telefone"
            [erro]="foiLimpo('telefone') ? 'Não é possível limpar este campo no momento.' : null">
            <input
              appCampo
              type="text"
              formControlName="telefone"
              placeholder="(81) 99999-0000"
              [estado]="foiLimpo('telefone') ? 'aviso' : 'normal'"
            />
          </app-campo-form>

          <app-campo-form
            rotulo="Nascimento"
            [erro]="foiLimpo('dataNascimento') ? 'Não é possível limpar este campo no momento.' : null">
            <input
              appCampo
              type="date"
              formControlName="dataNascimento"
              [estado]="foiLimpo('dataNascimento') ? 'aviso' : 'normal'"
            />
          </app-campo-form>
        </div>

        <app-campo-form
          rotulo="RG"
          tomErro="aviso"
          [erro]="foiLimpo('rg') ? 'Não é possível limpar este campo no momento.' : null">
          <input
            appCampo
            [mono]="true"
            type="text"
            formControlName="rg"
            placeholder="00.000.000-0"
            [estado]="foiLimpo('rg') ? 'aviso' : 'normal'"
          />
        </app-campo-form>

        <app-campo-form
          rotulo="Endereço completo"
          tomErro="aviso"
          [erro]="foiLimpo('enderecoCompleto') ? 'Não é possível limpar este campo no momento.' : null">
          <textarea
            appCampo
            formControlName="enderecoCompleto"
            rows="2"
            placeholder="Rua, número, bairro, cidade"
            [estado]="foiLimpo('enderecoCompleto') ? 'aviso' : 'normal'">
          </textarea>
        </app-campo-form>

        <div class="editar__acoes">
          <button appBotao variante="contorno" type="button" (click)="cancelar()" [disabled]="salvando()">
            Cancelar
          </button>
          <button appBotao type="submit" [disabled]="salvando()">
            {{ salvando() ? 'Salvando...' : 'Salvar alterações' }}
          </button>
        </div>

      </form>
    </app-cartao>
  }

</div>
