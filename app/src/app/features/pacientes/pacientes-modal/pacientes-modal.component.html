<app-modal titulo="Novo paciente" (fechar)="fechar.emit()">

  @if (avisoVinculacao()) {
    <app-alert variant="success" class="modal-paciente__aviso">
      Paciente já cadastrado no sistema — vinculado ao seu perfil.
    </app-alert>
  }

  @if (erro()) {
    <app-alert class="modal-paciente__aviso">{{ erro() }}</app-alert>
  }

  <form class="modal-paciente__form" [formGroup]="form" (ngSubmit)="submit()">

    @if (isAdmin) {
      <app-campo-form
        rotulo="Profissional"
        para="paciente-profissional"
        [obrigatorio]="true"
        [erro]="campoInvalido('usuario_id') ? 'Selecione um profissional.' : null">
        <select
          appCampo
          id="paciente-profissional"
          formControlName="usuario_id"
          [estado]="campoInvalido('usuario_id') ? 'invalido' : 'normal'">
          <option [value]="0" disabled>Selecione um profissional</option>
          @for (u of usuarios(); track u.id) {
            <option [value]="u.id">{{ u.nome || u.email }}</option>
          }
        </select>
      </app-campo-form>
    }

    <app-campo-form
      rotulo="Nome completo"
      para="paciente-nome"
      [obrigatorio]="true"
      [erro]="campoInvalido('nome') ? 'Informe o nome completo (mínimo 3 caracteres).' : null">
      <input
        appCampo
        id="paciente-nome"
        type="text"
        formControlName="nome"
        placeholder="Maria Oliveira"
        [estado]="campoInvalido('nome') ? 'invalido' : 'normal'"
      />
    </app-campo-form>

    <app-campo-form rotulo="CPF" para="paciente-cpf">
      <input
        appCampo
        [mono]="true"
        id="paciente-cpf"
        type="text"
        inputmode="numeric"
        formControlName="cpf"
        placeholder="123.456.789-00"
      />
    </app-campo-form>

    <div class="modal-paciente__dupla">
      <app-campo-form rotulo="Telefone" para="paciente-telefone">
        <input
          appCampo
          id="paciente-telefone"
          type="tel"
          formControlName="telefone"
          placeholder="(81) 99999-0000"
        />
      </app-campo-form>

      <app-campo-form rotulo="Nascimento" para="paciente-nascimento">
        <input
          appCampo
          id="paciente-nascimento"
          type="date"
          formControlName="dataNascimento"
        />
      </app-campo-form>
    </div>

    <app-campo-form rotulo="RG" para="paciente-rg">
      <input
        appCampo
        [mono]="true"
        id="paciente-rg"
        type="text"
        formControlName="rg"
        placeholder="00.000.000-0"
      />
    </app-campo-form>

    <app-campo-form rotulo="Endereço completo" para="paciente-endereco">
      <textarea
        appCampo
        id="paciente-endereco"
        formControlName="enderecoCompleto"
        rows="2"
        placeholder="Rua, número, bairro, cidade">
      </textarea>
    </app-campo-form>

    <div class="modal-paciente__acoes">
      <button appBotao variante="contorno" type="button" (click)="fechar.emit()">
        Cancelar
      </button>
      <button appBotao type="submit" [disabled]="loading() || avisoVinculacao()">
        {{ loading() ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </div>

  </form>
</app-modal>
