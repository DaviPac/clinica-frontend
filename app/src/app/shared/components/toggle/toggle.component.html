<label class="switch">
  <button
    type="button"
    role="switch"
    class="switch__trilho"
    [attr.aria-checked]="checked()"
    [disabled]="disabled()"
    (click)="onToggle()">
    <span class="switch__pino"></span>
  </button>
  @if (label()) {
    <span class="switch__rotulo">{{ label() }}</span>
  }
</label>
