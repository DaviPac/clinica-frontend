<div
  class="modal__fundo"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="titulo()"
  (click)="fechar.emit()">

  <div class="modal__caixa" (click)="$event.stopPropagation()">

    <div class="modal__cabecalho">
      <h2 class="modal__titulo">{{ titulo() }}</h2>
      <button
        appBotaoIcone
        type="button"
        class="modal__fechar"
        aria-label="Fechar"
        (click)="fechar.emit()">×</button>
    </div>

    <ng-content />
  </div>
</div>
