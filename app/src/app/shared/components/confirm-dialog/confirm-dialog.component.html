<div
  class="confirma__fundo"
  role="alertdialog"
  aria-modal="true"
  [attr.aria-label]="titulo()"
  (click)="cancelar.emit()">

  <div class="confirma__caixa" (click)="$event.stopPropagation()">

    <div class="confirma__topo">
      <div class="confirma__icone" aria-hidden="true">
        @if (variant() === 'danger') {
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M10 7v4.5M10 14h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M8.257 2.906h3.486a1 1 0 0 1 .857.486l7 11.5A1 1 0 0 1 18.743 16H1.257a1 1 0 0 1-.857-1.514l7-11.5a1 1 0 0 1 .857-.48Z" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        } @else if (variant() === 'success') {
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M4 10l4.5 4.5L16 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 9v4M10 6.5h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        }
      </div>

      <div class="confirma__textos">
        <h2 class="confirma__titulo">{{ titulo() }}</h2>
        @if (mensagem()) {
          <p class="confirma__mensagem">{{ mensagem() }}</p>
        }
      </div>
    </div>

    <ng-content />

    <div class="confirma__acoes">
      <button
        type="button"
        class="confirma__botao confirma__botao--cancelar"
        (click)="cancelar.emit()"
        [disabled]="loading()">
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="confirma__botao confirma__botao--confirmar"
        (click)="confirmar.emit()"
        [disabled]="loading()">
        {{ loading() ? loadingLabel() : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
