<div class="mensagem__topo">
  <div class="mensagem__icone" aria-hidden="true">
    @if (tom === 'perigo' || tom === 'aviso') {
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <path d="M10 7v4.5M10 14h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8.257 2.906h3.486a1 1 0 0 1 .857.486l7 11.5A1 1 0 0 1 18.743 16H1.257a1 1 0 0 1-.857-1.514l7-11.5a1 1 0 0 1 .857-.48Z" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    } @else if (tom === 'sucesso') {
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <path d="M4 10l4.5 4.5L16 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 9v4M10 6.5h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    }
  </div>

  <div class="mensagem__textos">
    @if (dados.titulo) {
      <h2 class="mensagem__titulo">{{ dados.titulo }}</h2>
      <p class="mensagem__texto">{{ dados.mensagem }}</p>
    } @else {
      <p class="mensagem__titulo">{{ dados.mensagem }}</p>
    }
  </div>
</div>

@if (dados.conteudo) {
  <ng-container [ngTemplateOutlet]="dados.conteudo" />
}

@if (erro()) {
  <app-alert>{{ erro() }}</app-alert>
}

<div class="mensagem__acoes">
  @if (confirmacao) {
    <button
      type="button"
      class="mensagem__botao mensagem__botao--cancelar"
      [disabled]="processando()"
      (click)="cancelar()">
      {{ dados.rotuloCancelar ?? 'Cancelar' }}
    </button>
    <button
      type="button"
      class="mensagem__botao mensagem__botao--confirmar"
      [disabled]="processando()"
      (click)="confirmar()">
      {{ processando() ? (dados.rotuloProcessando ?? 'Salvando...') : (dados.rotuloConfirmar ?? 'Confirmar') }}
    </button>
  } @else {
    <button
      type="button"
      class="mensagem__botao mensagem__botao--confirmar"
      (click)="confirmar()">
      Ok
    </button>
  }
</div>
