<button
  type="button"
  (click)="alternar()"
  [title]="rotulo()"
  [attr.aria-label]="rotulo()"
  [class]="mostrarRotulo() ? 'w-full' : 'w-auto'"
  class="flex items-center justify-center p-1.5 text-stone-400
         hover:text-stone-600 hover:bg-stone-50 rounded-md transition-colors
         cursor-pointer border-none bg-transparent text-xs gap-1.5">
  @if (escuro()) {
    <!-- sol: clicar volta para o tema claro -->
    <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  } @else {
    <!-- lua: clicar leva para o tema escuro -->
    <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  }
  @if (mostrarRotulo()) {
    <span class="whitespace-nowrap">{{ rotulo() }}</span>
  }
</button>
